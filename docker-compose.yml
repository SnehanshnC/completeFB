services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    restart: unless-stopped
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      - BACKEND_URL=http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
