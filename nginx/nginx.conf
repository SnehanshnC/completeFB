events {
    worker_connections 1024;
}

http {
    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name iscales.xyz www.iscales.xyz;

        # Used by certbot for SSL renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name iscales.xyz www.iscales.xyz;

        ssl_certificate     /etc/letsencrypt/live/iscales.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iscales.xyz/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Long-running AI generation — proxy directly to backend to avoid Next.js proxy timeout
        location /api/posts/generate-ai-image {
            proxy_pass         http://backend:8000/posts/generate-ai-image;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # All other traffic goes to Next.js
        location / {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
